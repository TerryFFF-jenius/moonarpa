name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm-gc, wasm, js, native]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned official MoonBit SDK
        env:
          MOONBIT_INSTALL_VERSION: 0.10.19+97801ee1b
        run: |
          curl --fail --location https://cli.moonbitlang.com/install/unix.sh -o /tmp/moonbit-install.sh
          bash /tmp/moonbit-install.sh
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Inspect source and interfaces
        run: |
          moon version --all
          moon update
          moon info
          moon fmt --check
          git diff --exit-code
          python scripts/check_project.py
      - name: Strict target validation and real workflows
        run: |
          moon check --deny-warn --target ${{ matrix.target }}
          moon test --deny-warn --target ${{ matrix.target }}
          moon build --deny-warn --target ${{ matrix.target }}
          moon run examples/speech --target ${{ matrix.target }}
          moon run examples/corpus --target ${{ matrix.target }}
          moon run examples/train --target ${{ matrix.target }}
          python scripts/verify_oracle.py --target ${{ matrix.target }}
      - name: Pinned external reference data
        if: matrix.target == 'wasm-gc'
        run: python scripts/verify_reference.py --target wasm-gc
